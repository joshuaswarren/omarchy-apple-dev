name: tests

on:
  push:
    branches: [main]
    paths-ignore: &doc-paths
      - 'docs/**'
      - 'receipts/**'
      - '**/*.md'
  pull_request:
    paths-ignore: *doc-paths

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-sh:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # last 30 runs finished in 2-5min; 15 is ~3x margin and still bounds the rare hang
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh
